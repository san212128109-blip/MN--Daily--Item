<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daraz Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">MyDaraz</div>
        <input type="text" placeholder="Search in MyDaraz..." class="search">
        <button class="search-btn">Search</button>
    </header>

    <!-- Banner -->
    <section class="banner">
        <img src="https://via.placeholder.com/1200x350" alt="Banner">
    </section>

    <!-- Categories -->
    <h2 class="section-title">Categories</h2>
    <div class="categories">
        <div class="cat-card">Electronics</div>
        <div class="cat-card">Fashion</div>
        <div class="cat-card">Mobile</div>
        <div class="cat-card">Home</div>
        <div class="cat-card">Gadgets</div>
    </div>

    <!-- Featured Products -->
    <h2 class="section-title">Featured Products</h2>
    <section class="products">
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Smart Watch</h3>
            <p>$20.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Bluetooth Earbuds</h3>
            <p>$15.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Sneakers</h3>
            <p>$25.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Backpack</h3>
            <p>$18.00</p>
            <button>Add to Cart</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2025 MyDaraz — All Rights Reserved</p>
    </footer>

</body>
</html>
