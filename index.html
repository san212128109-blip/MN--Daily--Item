<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MN Daily Items</title>
<style>
body{margin:0;font-family:sans-serif;background:#f9f9f9;}
header{display:flex;align-items:center;justify-content:space-between;padding:10px;background:#ff3f6c;color:white;flex-wrap:wrap;}
header input{padding:5px;width:200px;max-width:100%;}
header button{padding:5px 10px;margin:2px;}
.hero-slider{width:100%;height:300px;overflow:hidden;position:relative;}
.hero-slider img{width:100%;height:300px;object-fit:cover;transition:opacity 0.5s;}
.categories{padding:20px;}
.category-cards{display:flex;gap:10px;flex-wrap:wrap;}
.category-card{flex:1;min-width:120px;background:#fff;padding:10px;text-align:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.1);box-sizing:border-box;}
.category-card img{display:block;margin:0 auto 5px;width:80px;height:80px;}
.products{padding:20px;}
#productsList{display:flex;flex-wrap:wrap;gap:10px;}
.productCard{border:1px solid #ccc;padding:10px;width:150px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1);box-sizing:border-box;text-align:center;}
.checkout{padding:20px;background:#fff;margin:20px;display:none;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);}
.modal-content{background:white;padding:20px;margin:50px auto;width:300px;position:relative;box-sizing:border-box;}
.close, .closeAdmin{position:absolute;top:10px;right:10px;cursor:pointer;font-size:18px;font-weight:bold;}
#adminPanel{padding:20px;background:#fff;margin:20px;display:none;}
#adminProducts .productCard{width:200px;}
button{cursor:pointer;}
#adminImagePreview{display:none; position:fixed; top:0; right:0; width:50%; height:100%; background:#f0f0f0; text-align:center; overflow:auto; box-shadow:-2px 0 5px rgba(0,0,0,0.2); z-index:9999;}
#adminImagePreview img{max-width:100%; max-height:100%; margin-top:50px;}
#closePreview{position:absolute; top:10px; right:10px; cursor:pointer; font-size:20px;}
@media(max-width:768px){
  .category-cards{flex-direction:column;}
  #productsList{flex-direction:column;}
  header{flex-direction:column;align-items:flex-start;}
  #adminImagePreview{width:100%;height:50%;}
}
</style>
</head>
<body>

<header>
  <div class="logo">MN Daily Items</div>
  <input type="text" id="searchInput" placeholder="Search products...">
  <div>
    <button id="customerLoginBtnHeader">Customer Login</button>
    <button id="adminLoginBtnHeader">Admin Login</button>
  </div>
</header>

<div class="hero-slider">
  <img id="sliderImg" src="https://via.placeholder.com/1200x300?text=Banner+1" alt="Banner">
</div>

<section class="categories">
  <h2>Categories</h2>
  <div class="category-cards">
    <div class="category-card" data-category="Staples">
      <img src="https://via.placeholder.com/100?text=Staples"><br>Staples
    </div>
    <div class="category-card" data-category="Oils & Spices">
      <img src="https://via.placeholder.com/100?text=Oils"><br>Oils & Spices
    </div>
    <div class="category-card" data-category="Beverages">
      <img src="https://via.placeholder.com/100?text=Beverages"><br>Beverages
    </div>
    <div class="category-card" data-category="Snacks">
      <img src="https://via.placeholder.com/100?text=Snacks"><br>Snacks
    </div>
    <div class="category-card" data-category="Household">
      <img src="https://via.placeholder.com/100?text=Household"><br>Household
    </div>
  </div>
</section>

<section class="products" id="customerPage" style="display:none;">
  <h2>Featured Products</h2>
  <div id="productsList"></div>
</section>

<section class="checkout" id="checkoutSection">
  <h3>Checkout</h3>
  <p>Payment Number: <span id="paymentNumber"></span></p>
  <p>Method: bKash / Nagad</p>
</section>

<!-- Customer Login Modal -->
<div id="customerLoginModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>Customer Login</h3>
    <input type="text" id="customerPhone" placeholder="Enter phone number">
    <button id="loginCustomerBtn">Login</button>
  </div>
</div>

<!-- Admin Login Modal -->
<div id="adminLoginModal" class="modal">
  <div class="modal-content">
    <span class="closeAdmin">&times;</span>
    <h3>Admin Login</h3>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button id="adminLoginBtn">Login</button>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel">
  <h2>Store Admin</h2>
  <h3>Payment Number</h3>
  <input type="text" id="adminPayment" placeholder="Enter bKash/Nagad Number">
  <button id="savePayment">Save Number</button>

  <h3>Add Product</h3>
  <input type="text" id="prodName" placeholder="Product Name">
  <input type="number" id="prodPrice" placeholder="Price">
  <input type="text" id="prodImage" placeholder="Image URL">
  <select id="prodCategory">
    <option value="Staples">Staples</option>
    <option value="Oils & Spices">Oils & Spices</option>
    <option value="Beverages">Beverages</option>
    <option value="Snacks">Snacks</option>
    <option value="Household">Household</option>
  </select>
  <button id="addProductBtn">Add Product</button>

  <h3>All Products</h3>
  <div id="adminProducts"></div>

  <h3>Show Image</h3>
  <select id="imageDropdown">
    <option value="">Select Image</option>
    <option value="https://via.placeholder.com/600x400?text=Image+1">Image 1</option>
    <option value="https://via.placeholder.com/600x400?text=Image+2">Image 2</option>
    <option value="https://via.placeholder.com/600x400?text=Image+3">Image 3</option>
    <option value="https://via.placeholder.com/600x400?text=Image+4">Image 4</option>
  </select>
  <button id="showImageBtn">Show Image</button>
</div>

<!-- Admin Image Preview -->
<div id="adminImagePreview">
  <span id="closePreview">&times;</span>
  <img id="previewImg" src="" alt="Preview">
</div>

<script>
// Slider
let sliderImages=["https://via.placeholder.com/1200x300?text=Banner+1","https://via.placeholder.com/1200x300?text=Banner+2","https://via.placeholder.com/1200x300?text=Banner+3"];
let sliderIndex=0;
setInterval(()=>{
  const img=document.getElementById('sliderImg');
  img.style.opacity=0;
  setTimeout(()=>{img.src=sliderImages[sliderIndex];img.style.opacity=1;sliderIndex=(sliderIndex+1)%sliderImages.length;},200);
},3000);

// Products
let products=JSON.parse(localStorage.getItem('products'))||[];

// Customer Login
const customerLoginBtnHeader=document.getElementById('customerLoginBtnHeader');
const customerModal=document.getElementById('customerLoginModal');
const closeModal=document.querySelector('.close');
const loginCustomerBtn=document.getElementById('loginCustomerBtn');
const customerPhoneInput=document.getElementById('customerPhone');

customerLoginBtnHeader.onclick=()=>{customerModal.style.display='block';document.body.style.overflow='hidden';}
closeModal.onclick=()=>{customerModal.style.display='none';document.body.style.overflow='auto';}
loginCustomerBtn.onclick=()=>{
  const phone = customerPhoneInput.value.trim();
  if(phone){
    localStorage.setItem('customerPhone', phone);
    customerModal.style.display='none';
    document.body.style.overflow='auto';
    loadCustomerPage();
    alert("Login successful!");
  } else alert("Enter phone number");
}

// Auto login
if(localStorage.getItem('customerPhone')) loadCustomerPage();

function loadCustomerPage(){
  document.getElementById('customerPage').style.display='block';
  document.getElementById('checkoutSection').style.display='none'; // Hide checkout until Buy Now clicked
  loadProducts();
}

// Load products
function loadProducts(filterCategory){
  const list=document.getElementById('productsList');list.innerHTML='';
  let filtered=products;
  if(filterCategory) filtered=products.filter(p=>p.category===filterCategory);
  filtered.forEach(p=>{
    list.innerHTML+=`<div class="productCard">
      <img src="${p.image || 'https://via.placeholder.com/100'}" width="100"><br>
      <b>${p.name}</b> - ৳${p.price}<br>
      Category: ${p.category}<br>
      <button onclick="buyNow('${p.name}','${p.price}')">Buy Now</button>
    </div>`;
  });
}

// Search
document.getElementById('searchInput').addEventListener('input',function(){
  const val=this.value.toLowerCase();
  const filtered=products.filter(p=>p.name.toLowerCase().includes(val)||p.category.toLowerCase().includes(val));
  const list=document.getElementById('productsList');list.innerHTML='';
  filtered.forEach(p=>{
    list.innerHTML+=`<div class="productCard">
      <img src="${p.image || 'https://via.placeholder.com/100'}" width="100"><br>
      <b>${p.name}</b> - ৳${p.price}<br>
      Category: ${p.category}<br>
      <button onclick="buyNow('${p.name}','${p.price}')">Buy Now</button>
    </div>`;
  });
});

// Category filter
document.querySelectorAll('.category-card').forEach(card=>{card.onclick=()=>loadProducts(card.getAttribute('data-category'));});

// Buy Now
function buyNow(productName, price){
  const checkout = document.getElementById('checkoutSection');
  checkout.style.display = 'block';
  const paymentNumber = localStorage.getItem('paymentNumber') || 'Not set';
  document.getElementById('paymentNumber').innerText = paymentNumber;
  alert(`You selected ${productName} - ৳${price}. Payment number shown above.`);
}
window.buyNow = buyNow;

// Admin Login
const adminLoginBtnHeader=document.getElementById('adminLoginBtnHeader');
const adminModal=document.getElementById('adminLoginModal');
const closeAdmin=document.querySelector('.closeAdmin');
const adminLoginBtn=document.getElementById('adminLoginBtn');

adminLoginBtnHeader.onclick=()=>{adminModal.style.display='block';document.body.style.overflow='hidden';}
closeAdmin.onclick=()=>{adminModal.style.display='none';document.body.style.overflow='auto';}
adminLoginBtn.onclick=()=>{
  const username=document.getElementById('adminUser').value;
  const password=document.getElementById('adminPass').value;
  if(username==="Daily"&&password==="nafis128!@*"){
    adminModal.style.display='none';
    document.body.style.overflow='auto';
    document.getElementById('adminPanel').style.display='block';
    loadAdminProducts();
  } else alert("Wrong credentials");
}

// Admin panel functions
const savePayment=document.getElementById('savePayment');
const adminPayment=document.getElementById('adminPayment');
const addProductBtn=document.getElementById('addProductBtn');
const adminProducts=document.getElementById('adminProducts');

savePayment.onclick=()=>{
  const val=adminPayment.value.trim();
  if(val){localStorage.setItem('paymentNumber',val);alert("Saved!");}else alert("Enter number");
}

addProductBtn.onclick=()=>{
  const name=document.getElementById('prodName').value;
  const price=document.getElementById('prodPrice').value;
  const imageUrl=document.getElementById('prodImage').value.trim();
  const category=document.getElementById('prodCategory').value;
  const image = imageUrl || 'https://via.placeholder.com/100';
  if(name&&price&&category){
    products.push({name,price,image,category});
    localStorage.setItem('products',JSON.stringify(products));
    loadAdminProducts();
    loadCustomerPage();
    alert("Product added!");
  } else alert("Fill all fields");
}

function loadAdminProducts(){
  adminProducts.innerHTML='';
  products.forEach((p,i)=>{
    adminProducts.innerHTML+=`<div class="productCard">
      <img src="${p.image || 'https://via.placeholder.com/100'}" width="100"><br>
      <b>${p.name}</b> - ৳${p.price}<br>
      Category: ${p.category}<br>
      <button onclick="deleteProduct(${i})">Delete</button>
    </div>`;
  });
}

function deleteProduct(i){
  products.splice(i,1);
  localStorage.setItem('products',JSON.stringify(products));
  loadAdminProducts();
  loadCustomerPage();
}
window.deleteProduct=deleteProduct;

// Admin Image Preview with Dropdown
const imageDropdown = document.getElementById('imageDropdown');
const showImageBtn = document.getElementById('showImageBtn');
const adminImagePreview = document.getElementById('adminImagePreview');
const previewImg = document.getElementById('previewImg');
const closePreview = document.getElementById('closePreview');

showImageBtn.onclick = () => {
  const url = imageDropdown.value;
  if(url){
    previewImg.src = url;
    adminImagePreview.style.display = 'block';
  } else alert("Select an image from the dropdown");
}

closePreview.onclick = () => {
  adminImagePreview.style.display = 'none';
  previewImg.src = '';
}
</script>
</body>
</html>
